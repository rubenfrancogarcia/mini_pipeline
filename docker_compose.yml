services: 
  db: 
    image: mysql:latest
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} 
      MYSQL_DATABASE: ${MYSQL_DATABASE} 
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_USER_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports: 
      - "3306:3306"
    volumes: 
      - db_data:/var/lib/mysql 
volumes:
  db_data: